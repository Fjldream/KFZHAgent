<!DOCTYPE html>
<html>

<head>
    <title>HT for Web</title>
    <meta charset="UTF-8">
    <meta name='viewport' content='user-scalable=no'>
    <link rel="shortcut icon" href="custom/images/favicon_2d.ico" />
    <style>
        html,
        body {
            padding: 0px;
            margin: 0px;
        }
    </style>

    <!-- ht config -->
    <script src='custom/configs/htconfig.js'></script>
    <script src='custom/configs/config-transform.js'></script>
    <script src='custom/configs/config-service.js'></script>

    <!-- configuration for editor -->
    <script src='custom/configs/2d/config.js'></script>

    <!-- ht core -->
    <script src='libs/core/ht.js'></script>
    <script src='custom/configs/buckle.js'></script>
    <script src="libs/core/ht-ui.js"></script>
    <!-- ht plugins -->
    <script src="libs/plugin/ht-cssanimation.js"></script>
    <script src='libs/plugin/ht-contextmenu.js'></script>
    <script src='libs/plugin/ht-dialog.js'></script>
    <script src='libs/plugin/ht-edgetype.js'></script>
    <script src='libs/plugin/ht-form.js'></script>
    <script src='libs/plugin/ht-overview.js'></script>
    <script src="libs/plugin/ht-autolayout.js"></script>
    <script src="libs/plugin/ht-obj.js"></script>
    <script src="libs/plugin/ht-historymanager.js"></script>
    <script src="libs/plugin/ht-vector.js"></script>

    <!-- socket.io -->
    <!-- KF3.6中使用 -->
    <script src="/kingclient3d/socket.io/socket.io.js"></script>
    <!-- KP2.0中使用 -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        function init() {
            var urls = hteditor_config.subConfigs || [];
            urls.push('libs/client.js');
            ht.Default.loadJS(urls, function () {
                urls = [
                    'locales/' + hteditor_config.locale + '.js',
                    'custom/locales/' + hteditor_config.locale + '.js'
                ];
                if (hteditor_config.libs) {
                    urls = urls.concat(hteditor_config.libs);
                }
                ht.Default.loadJS(urls, function () {
                    hteditor.init();
                    window.editor = hteditor.createEditor();
                    window.editor.isSaveInKP = false;
                    // 重写preview方法 add by lei.zhang
                    window.editor.preview = function () {
                        var previewURL = "display.html";
                        previewURL += "?tag=" + encodeURI(this.url);
                        // 获取工程信息 add by lei.zhang
                        var searchArr = window.location.search ? window.location.search.split('=') : [''];
                        var projectInfo = searchArr[searchArr.length - 1];
                        if (-1 !== previewURL.indexOf("?")) {
                            previewURL += '&projectInfo=' + projectInfo;
                        } else {
                            previewURL += '?projectInfo=' + projectInfo;
                        }
                        window.open(previewURL, previewURL);
                    }
                });
                window.addEventListener('message', function (e) {
                    if (e.source !== window.parent) return;
                    if (e.data === 'save') {
                        // 父页面触发保存
                        if (window.editor.mainTabView.currentTab) {
                            window.editor.save();
                            window.editor.isSaveInKP = true;
                        } else {
                            // 没有打开图纸时退出
                            window.parent.postMessage('closed', editor.parentHref);
                            window.parent.postMessage('closedIn2d', editor.parentHref);
                        }
                    } else if (typeof e.data === 'string' && e.data.indexOf('http') !== -1) {
                        // 记录父级页面的href,用来和父级页面进行通讯
                        window.editor.parentHref = e.data;
                    }
                })
            });
        }
    </script>
</head>

<body onload='init()'>
</body>

</html>
