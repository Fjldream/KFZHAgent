<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" lang="en" />
        <meta name="product" content="KF3.6" />
        <title></title>
        <style>
            .custom-loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 9999;
                width: 100vw;
                height: 100vh;
                background: rgba(255, 255, 255, 0.7);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .loading-inner {
                width: 500px;
                text-align: center;
            }

            .loading-text {
                margin-bottom: 10px;
                font-size: 14px;
                color: #4f9bf7;
                display: block;
            }
        </style>
        <script type="module">
            import { cardio } from './ldrs/dist/index.js';
            cardio.register();
        </script>
        <script type="text/javascript" src="/kingclient/extension/KingPortal_entrance.js"></script>
    </head>

    <body style="padding: 0" class="optimize">
        <div class="custom-loading-overlay" id="developLoadingId">
            <l-cardio size="50" stroke="4" speed="4" color="#4f9bf7"></l-cardio>
            <div class="loading-text">loding...</div>
        </div>
        <script>
            //语言切换
            const language = {
                'zh': ['KingPortal 开发系统客户端', '页面加载中...'],
                'ko': ['페이지 편집기', '페이지를 불러오는 중...'],
                'ja': ['KingPortal 开发系统客户端', '页面加载中...'],
                'en': ['KingPortal 开发系统客户端', '页面加载中...'],
            };
            let langStore = document.querySelector('meta').getAttribute('language') || 'zh';
            let scriptLangList = ``;
            if (langStore) {
                let jsLangFileArr = language[langStore];
                document.title = jsLangFileArr[0];
                document.querySelector('.loading-text').innerHTML = jsLangFileArr[1];
            }
        </script>
    </body>
</html>
