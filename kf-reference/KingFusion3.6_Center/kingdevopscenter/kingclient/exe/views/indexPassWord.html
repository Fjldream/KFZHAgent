<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #adminChangePassWord{
            /* display: none; */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }
        #modal-cantent{
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            max-width: 350px;
            border-radius: 5px;
        }
        #adminClose{
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        #adminClose:hover,
        #adminClose:focus{
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        #adminmodal-body{
            margin-left: 10%;
        }
        #adminmodal-header,
        #adminmodal-body,
        #adminmodal-footer{
            margin-bottom: 10px;
        }
        h3{
            margin: 0px;
            margin-bottom: 18px;
        }
        #adminmodal-body input{
            width: 60%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #adminmodal-footer{
            text-align: right;
            padding: 10px;
        }
        #adminSubBtn{
            background-color: rgb(16, 97, 219);
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 12px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
        }
        #cancalBtn{
            background-color:white;
            color: black;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 12px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="adminChangePassWord">
        <div id="modal-cantent">
            <span id="adminClose">&times;</span>
            <h3>修改密码</h3>
            <div id="adminmodal-body">
                <div>
                    <label for="currentPassWord">原密码:</label>
                    <input type="password" id="currentPassWord" placeholder="请输入当前密码">
                </div>
                <div>
                    <label for="newPassWord">新密码:</label>
                    <input type="password" id="newPassWord" placeholder="请输入新密码">
                    <img src="static/images/icon_login/view.png" class="icon_newshowpwd" id="icon_newshowpwd1" @click="changType()">
                </div>
                <div>
                    <label for="confirmPassWord">确认密码:</label>
                    <input type="password" id="confirmPassWord" placeholder="确认新密码">
                    <img src="static/images/icon_login/view.png" class="icon_newshowpwd" id="icon_newshowpwd2" @click="changType()">
                </div>
            </div>
            <div id="adminmodal-footer">
                <button id="adminSubBtn">确认</button>
                <button id="cancalBtn">取消</button>
            </div>
        </div>
    </div>
</body>
</html>
